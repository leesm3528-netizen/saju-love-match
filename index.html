<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연애 궁합</title>
  <style>
    :root {
      --bg: #fff5f7;
      --card: #ffffff;
      --text: #2d2a32;
      --muted: #8a8391;
      --accent: #e8577e;
      --accent-soft: #fde4eb;
      --border: #f0d9e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { text-align: center; margin: 0 0 6px; font-size: 28px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 28px; }
    .people { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .people { grid-template-columns: 1fr; } }
    fieldset {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin: 0;
    }
    legend {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    button {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 28px auto 0;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    #result {
      display: none;
      margin-top: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    #result table { width: 100%; border-collapse: collapse; }
    #result th, #result td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; }
    #result th { color: var(--muted); font-weight: 600; }
    #result h3 { margin: 28px 0 10px; font-size: 18px; }
    .total { text-align: center; padding: 8px 0 16px; }
    .score { font-size: 56px; font-weight: 800; color: var(--accent); line-height: 1; }
    .score small { font-size: 20px; margin-left: 2px; }
    .grade { margin-top: 8px; font-size: 18px; font-weight: 700; }
    .bars > div { display: grid; grid-template-columns: 90px 1fr 32px; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
    .bars b { text-align: right; }
    .bar { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .detail { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .detail-head { display: flex; justify-content: space-between; align-items: center; }
    .detail p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
    .tag { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }

    /* 점수 링 */
    .ring { position: relative; width: 180px; height: 180px; margin: 0 auto; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { stroke: var(--accent-soft); }
    .ring-fg { stroke: var(--accent); stroke-linecap: round; }
    .ring .score { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .grade { opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
    .grade.show { opacity: 1; transform: none; }
    .bar i { width: 0; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }

    /* 아바타 무대 */
    .stage {
      position: relative; overflow: hidden; margin-top: 24px; padding: 20px 16px;
      border-radius: 16px; background: linear-gradient(180deg, var(--accent-soft), #fff);
      text-align: center;
    }
    .stage-title { margin: 0 0 4px; font-size: 15px; }
    .stage-title b { color: var(--accent); }
    .charm { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
    .avatar-wrap { width: 180px; margin: 0 auto; opacity: 0; transform: translateY(40px) scale(.9); }
    .avatar-wrap.show { animation: pop .8s cubic-bezier(.2, 1.4, .4, 1) forwards, float 3s ease-in-out .8s infinite; }
    .avatar-svg { display: block; width: 100%; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .talking .mouth { transform-box: fill-box; transform-origin: center; animation: talk .22s infinite alternate; }
    .bubble {
      position: relative; max-width: 460px; margin: 16px auto 0; padding: 14px 16px;
      background: #fff; border: 2px solid var(--accent); border-radius: 16px; text-align: left;
      opacity: 0; transition: opacity .4s;
    }
    .bubble.show { opacity: 1; }
    .bubble::before {
      content: ""; position: absolute; top: -10px; left: 50%; margin-left: -9px;
      border: 9px solid transparent; border-top: 0; border-bottom-color: var(--accent);
    }
    #speech { margin: 0; min-height: 52px; font-size: 16px; line-height: 1.6; }
    #nextLine {
      display: block; width: auto; max-width: none; margin: 8px 0 0 auto; padding: 6px 14px; font-size: 13px;
    }
    .heart { position: absolute; bottom: -24px; font-size: 22px; pointer-events: none; animation: rise 2.8s ease-in forwards; }

    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes talk { to { transform: scaleY(1.9); } }
    @keyframes rise { to { transform: translateY(-380px) rotate(25deg); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
      .avatar-wrap, .grade { opacity: 1; transform: none; }
    }

    /* 연애 리포트 */
    .report { margin-top: 28px; }
    .chapter { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
    .chapter .no { font-size: 12px; font-weight: 700; color: var(--accent); }
    .chapter h4 { margin: 4px 0 8px; font-size: 17px; }
    .chapter p { margin: 0 0 6px; font-size: 14px; line-height: 1.7; }
    .chapter .tip { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    /* 공유 링크 */
    .share { display: flex; gap: 8px; margin-top: 20px; }
    .share input { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
    .share button { width: auto; max-width: none; margin: 0; padding: 10px 16px; font-size: 14px; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>💕 연애 궁합</h1>
    <p class="sub">두 사람의 정보를 입력해 주세요</p>

    <form id="matchForm">
      <div class="people">
        <fieldset data-person="me">
          <legend>나</legend>
          <label for="me-gender">성별</label>
          <select id="me-gender" name="me-gender" required>
            <option value="">선택하세요</option>
            <option value="female">여자</option>
            <option value="male">남자</option>
          </select>
          <label for="me-birth">생년월일</label>
          <input type="date" id="me-birth" name="me-birth" required />
          <label for="me-age">나이</label>
          <input type="number" id="me-age" name="me-age" min="1" max="120" required />
          <p class="hint">생년월일을 입력하면 자동으로 계산됩니다</p>
          <div class="row">
            <div>
              <label for="me-height">키 (cm)</label>
              <input type="number" id="me-height" name="me-height" min="50" max="250" step="0.1" required />
            </div>
            <div>
              <label for="me-weight">몸무게 (kg)</label>
              <input type="number" id="me-weight" name="me-weight" min="10" max="300" step="0.1" required />
            </div>
          </div>
          <label for="me-blood">혈액형</label>
          <select id="me-blood" name="me-blood" required>
            <option value="">선택하세요</option>
            <option>A</option><option>B</option><option>O</option><option>AB</option>
          </select>
          <label for="me-mbti">MBTI</label>
          <select id="me-mbti" name="me-mbti" class="mbti-select" required>
            <option value="">선택하세요</option>
          </select>
        </fieldset>

        <fieldset data-person="partner">
          <legend>상대방</legend>
          <label for="partner-gender">성별</label>
          <select id="partner-gender" name="partner-gender" required>
            <option value="">선택하세요</option>
            <option value="female">여자</option>
            <option value="male">남자</option>
          </select>
          <label for="partner-birth">생년월일</label>
          <input type="date" id="partner-birth" name="partner-birth" required />
          <label for="partner-age">나이</label>
          <input type="number" id="partner-age" name="partner-age" min="1" max="120" required />
          <p class="hint">생년월일을 입력하면 자동으로 계산됩니다</p>
          <div class="row">
            <div>
              <label for="partner-height">키 (cm)</label>
              <input type="number" id="partner-height" name="partner-height" min="50" max="250" step="0.1" required />
            </div>
            <div>
              <label for="partner-weight">몸무게 (kg)</label>
              <input type="number" id="partner-weight" name="partner-weight" min="10" max="300" step="0.1" required />
            </div>
          </div>
          <label for="partner-blood">혈액형</label>
          <select id="partner-blood" name="partner-blood" required>
            <option value="">선택하세요</option>
            <option>A</option><option>B</option><option>O</option><option>AB</option>
          </select>
          <label for="partner-mbti">MBTI</label>
          <select id="partner-mbti" name="partner-mbti" class="mbti-select" required>
            <option value="">선택하세요</option>
          </select>
        </fieldset>
      </div>

      <button type="submit">궁합 보기</button>
    </form>

    <section id="result"></section>
  </main>

  <script src="compat.js"></script>
  <script src="avatar.js"></script>
  <script src="report.js"></script>
  <script>
    const PEOPLE = ["me", "partner"];
    const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let typingTimer = null;

    // 생년월일 → 만 나이 자동 계산
    function calcAge(dateStr) {
      const birth = new Date(dateStr);
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
      return age;
    }

    document.querySelectorAll(".mbti-select").forEach((sel) => {
      MBTI_TYPES.forEach((t) => sel.add(new Option(t, t)));
    });

    PEOPLE.forEach((p) => {
      document.getElementById(`${p}-birth`).addEventListener("change", (e) => {
        if (e.target.value) document.getElementById(`${p}-age`).value = calcAge(e.target.value);
      });
    });

    // 내 성별을 고르면 상대방 성별을 반대로 미리 채워줌 (변경 가능)
    document.getElementById("me-gender").addEventListener("change", (e) => {
      const partner = document.getElementById("partner-gender");
      if (!partner.value && e.target.value) partner.value = e.target.value === "female" ? "male" : "female";
    });

    function readPerson(p) {
      const v = (field) => document.getElementById(`${p}-${field}`).value;
      return {
        gender: v("gender"),
        birth: v("birth"),
        age: Number(v("age")),
        height: Number(v("height")),
        weight: Number(v("weight")),
        blood: v("blood"),
        mbti: v("mbti"),
      };
    }

    // ---------- 공유 링크 ----------
    // ?me=f_1995-03-12_162_52_A_ISFP&p=m_1993-08-20_180_74_O_ENTJ
    const SHARE_FIELDS = ["gender", "birth", "height", "weight", "blood", "mbti"];

    function encodePerson(person) {
      return [person.gender === "female" ? "f" : "m", person.birth, person.height, person.weight, person.blood, person.mbti].join("_");
    }

    function decodePerson(str) {
      const parts = (str || "").split("_");
      if (parts.length !== SHARE_FIELDS.length) return null;
      const [g, birth, height, weight, blood, mbti] = parts;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(birth) || !BLOOD_ORDER.includes(blood) || !MBTI_TYPES.includes(mbti)) return null;
      return { gender: g === "f" ? "female" : "male", birth, height, weight, blood, mbti };
    }

    function shareUrl(data) {
      const q = new URLSearchParams({ me: encodePerson(data.me), p: encodePerson(data.partner) });
      return `${location.origin === "null" ? "" : location.origin}${location.pathname}?${q}`;
    }

    function fillFromUrl() {
      const q = new URLSearchParams(location.search);
      const me = decodePerson(q.get("me"));
      const partner = decodePerson(q.get("p"));
      if (!me || !partner) return false;
      for (const [p, person] of [["me", me], ["partner", partner]]) {
        SHARE_FIELDS.forEach((f) => (document.getElementById(`${p}-${f}`).value = person[f]));
        document.getElementById(`${p}-age`).value = calcAge(person.birth);
      }
      return true;
    }

    const RING_C = 2 * Math.PI * 52;
    const wait = (ms) => new Promise((res) => setTimeout(res, REDUCED ? 0 : ms));

    // 점수 카운트업 + 원형 게이지
    function countUp(el, ring, target, duration) {
      if (REDUCED) {
        el.textContent = target;
        ring.style.strokeDashoffset = RING_C * (1 - target / 100);
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        const t0 = performance.now();
        const step = (now) => {
          const t = Math.min((now - t0) / duration, 1);
          const v = Math.round(target * (1 - Math.pow(1 - t, 3)));
          el.textContent = v;
          ring.style.strokeDashoffset = RING_C * (1 - v / 100);
          t < 1 ? requestAnimationFrame(step) : resolve();
        };
        requestAnimationFrame(step);
      });
    }

    // 말풍선 타이핑 + 입 움직임
    function typeLine(el, text, wrap) {
      clearInterval(typingTimer);
      if (REDUCED) { el.textContent = text; return; }
      el.textContent = "";
      wrap.classList.add("talking");
      let i = 0;
      typingTimer = setInterval(() => {
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) {
          clearInterval(typingTimer);
          wrap.classList.remove("talking");
        }
      }, 45);
    }

    function burstHearts(stage, count) {
      if (REDUCED) return;
      const icons = ["💗", "💕", "💖", "✨", "💘"];
      for (let i = 0; i < count; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = icons[i % icons.length];
        h.style.left = `${5 + Math.random() * 90}%`;
        h.style.animationDelay = `${Math.random() * 1.2}s`;
        h.style.fontSize = `${16 + Math.random() * 16}px`;
        stage.appendChild(h);
        h.addEventListener("animationend", () => h.remove());
      }
    }

    // 점수 → 막대 → 아바타 등장 → 멘트 순서로 연출
    async function reveal(r, lines) {
      await countUp(document.getElementById("scoreNum"), document.querySelector(".ring-fg"), r.total, 1600);
      document.querySelector(".grade").classList.add("show");
      document.querySelectorAll(".bar i").forEach((bar) => (bar.style.width = `${bar.dataset.w}%`));

      await wait(700);
      const stage = document.querySelector(".stage");
      const wrap = document.querySelector(".avatar-wrap");
      wrap.classList.add("show");
      burstHearts(stage, r.total >= 80 ? 18 : 8);

      await wait(800);
      const speech = document.getElementById("speech");
      const next = document.getElementById("nextLine");
      document.querySelector(".bubble").classList.add("show");
      let idx = 0;
      typeLine(speech, lines[idx], wrap);
      next.onclick = () => {
        idx = (idx + 1) % lines.length;
        typeLine(speech, lines[idx], wrap);
        next.textContent = idx === lines.length - 1 ? "처음부터 ↺" : "다음 ▶";
        if (idx === lines.length - 1) burstHearts(stage, 10);
      };
    }

    document.getElementById("matchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      clearInterval(typingTimer);
      const data = { me: readPerson("me"), partner: readPerson("partner") };
      const r = calcCompatibility(data.me, data.partner);
      const [pa, pb] = r.saju.pillars;

      // 상대방 성별의 아바타가 내 사주(부족한 오행)에 맞춰 등장
      const avatar = pickAvatar(data.partner.gender, pa);
      const lines = avatarLines(avatar, r.total);
      const report = buildReport(pa, pb, avatar.element);
      const link = shareUrl(data);
      try { history.replaceState(null, "", `?${link.split("?")[1]}`); } catch {}
      const genderText = (g) => (g === "female" ? "여자" : "남자");

      const rows = [
        ["성별", genderText(data.me.gender), genderText(data.partner.gender)],
        ["생년월일", data.me.birth, data.partner.birth],
        ["나이", data.me.age, data.partner.age],
        ["키 (cm)", data.me.height, data.partner.height],
        ["몸무게 (kg)", data.me.weight, data.partner.weight],
        ["혈액형", data.me.blood, data.partner.blood],
        ["MBTI", data.me.mbti, data.partner.mbti],
        ["띠", ANIMALS[pa.year.branch], ANIMALS[pb.year.branch]],
        ["연주", pillarText(pa.year), pillarText(pb.year)],
        ["월주", pillarText(pa.month), pillarText(pb.month)],
        ["일주", pillarText(pa.day), pillarText(pb.day)],
      ];
      const detail = (title, item) => `
        <div class="detail">
          <div class="detail-head"><strong>${title}</strong><span class="tag">${item.label}</span></div>
          <p>${item.desc}</p>
        </div>`;
      const bar = (label, score) =>
        `<div><span>${label}</span><div class="bar"><i data-w="${score}"></i></div><b>${score}</b></div>`;

      const result = document.getElementById("result");
      result.innerHTML = `
        <div class="total">
          <div class="ring">
            <svg viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
              <circle class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke-width="10"
                stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"/>
            </svg>
            <div class="score"><span id="scoreNum">0</span><small>점</small></div>
          </div>
          <div class="grade">${r.grade}</div>
        </div>
        <div class="bars">
          ${bar("사주 궁합", r.saju.score)}
          ${bar("MBTI 궁합", r.mbti.score)}
          ${bar("혈액형 궁합", r.blood.score)}
          ${bar("체격 궁합", r.body.score)}
        </div>

        <div class="stage">
          <p class="stage-title">내 사주에 부족한 <b>${ELEMENTS[avatar.element]}(${ELEMENTS_KO[avatar.element]})</b> 기운을 채워줄 <b>${avatar.type}</b></p>
          <p class="charm">매력 포인트 · ${avatar.charm}</p>
          <div class="avatar-wrap">${avatarSVG(avatar, data.partner.gender)}</div>
          <div class="bubble">
            <p id="speech"></p>
            <button type="button" id="nextLine">다음 ▶</button>
          </div>
        </div>

        <div class="share">
          <input id="shareLink" type="text" readonly value="${link}" aria-label="결과 공유 링크" />
          <button type="button" id="copyLink">🔗 링크 복사</button>
        </div>

        <section class="report">
          <h3>💌 두 사람의 연애 리포트</h3>
          <div class="chapter">
            <div class="no">제1장 · 나의 연애 스타일 (${ELEMENTS[report.style.element]} 일간)</div>
            <h4>${report.style.title}</h4>
            <p>${report.style.body}</p>
            <p class="tip">⚠️ ${report.style.caution}</p>
          </div>
          <div class="chapter">
            <div class="no">제2장 · 두 사람의 케미</div>
            <h4>${report.chemistry.title}</h4>
            <p>${report.chemistry.body} ${report.chemistry.hapText}</p>
            <p class="tip">💡 ${report.chemistry.tip}</p>
          </div>
          <div class="chapter">
            <div class="no">제3장 · ${ELEMENTS[report.lucky.element]} 기운을 채우는 행운의 데이트</div>
            <h4>이렇게 만나 보세요</h4>
            <div class="chips">
              <span class="chip">🎨 ${report.lucky.color}</span>
              <span class="chip">📍 ${report.lucky.place}</span>
              <span class="chip">🍽️ ${report.lucky.food}</span>
              <span class="chip">🎁 ${report.lucky.item}</span>
            </div>
          </div>
        </section>

        <h3>사주 궁합</h3>
        ${detail("띠 궁합", r.saju.zodiac)}
        ${detail("일간 궁합", r.saju.dayMaster)}
        ${detail("오행 보완", r.saju.balance)}

        <h3>MBTI 궁합</h3>
        ${detail(`${data.me.mbti} × ${data.partner.mbti}`, { label: `${r.mbti.label} · ${r.mbti.score}점`, desc: r.mbti.notes.join("<br>") })}

        <h3>혈액형 궁합</h3>
        ${detail(`${data.me.blood}형 × ${data.partner.blood}형`, { label: `${r.blood.score}점`, desc: r.blood.desc })}

        <h3>체격 궁합</h3>
        ${detail(`키 차이 ${r.body.height.diff}cm`, r.body.height)}
        ${detail(`BMI 차이 ${r.body.bmi.diff}`, r.body.bmi)}

        <h3>두 사람의 정보</h3>
        <table>
          <tr><th>항목</th><th>나</th><th>상대방</th></tr>
          ${rows.map(([label, a, b]) => `<tr><td>${label}</td><td>${a}</td><td>${b}</td></tr>`).join("")}
        </table>
        <p class="hint">※ 태어난 시간 없이 생년월일로만 계산하며, 절기는 평균 날짜로 근사합니다. 재미로 봐주세요!</p>`;
      result.style.display = "block";
      result.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" });
      reveal(r, lines);

      document.getElementById("copyLink").onclick = async (ev) => {
        const input = document.getElementById("shareLink");
        try {
          await navigator.clipboard.writeText(input.value);
        } catch {
          input.select();
          document.execCommand("copy");
        }
        ev.target.textContent = "✅ 복사됐어요";
        setTimeout(() => (ev.target.textContent = "🔗 링크 복사"), 1500);
      };
    });

    // 공유 링크로 들어오면 입력값을 채우고 바로 결과를 보여줌
    if (fillFromUrl()) document.getElementById("matchForm").requestSubmit();
  </script>
</body>
</html>
