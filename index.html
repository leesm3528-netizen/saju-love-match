<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연애 사주</title>
  <style>
    :root {
      --bg: #fff5f7;
      --card: #ffffff;
      --text: #2d2a32;
      --muted: #8a8391;
      --accent: #e8577e;
      --accent-soft: #fde4eb;
      --border: #f0d9e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
    header { position: relative; text-align: center; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
    .home-link {
      position: absolute; left: 0; top: 6px; font-size: 14px; color: var(--muted); text-decoration: none;
    }
    .home-link:hover { color: var(--accent); }
    [hidden] { display: none !important; }

    /* 시작 화면 */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }
    .choice {
      display: block; padding: 28px 20px; border-radius: 20px; text-align: center; text-decoration: none; color: var(--text);
      background: var(--card); border: 2px solid var(--border); transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .choice:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 24px rgba(232, 87, 126, .15); }
    .choice .emoji { font-size: 48px; }
    .choice h2 { margin: 10px 0 6px; font-size: 22px; }
    .choice p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .choice .go { display: inline-block; margin-top: 14px; padding: 8px 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; }

    /* 입력 폼 */
    .people { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .people.single { grid-template-columns: 1fr; max-width: 440px; margin: 0 auto; }
    @media (max-width: 640px) { .people { grid-template-columns: 1fr; } }
    fieldset {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin: 0;
      min-width: 0;
    }
    legend {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    button {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 28px auto 0;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }

    /* 결과 */
    #result {
      margin-top: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    #result table { width: 100%; border-collapse: collapse; }
    #result th, #result td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; }
    #result th { color: var(--muted); font-weight: 600; }
    #result h3 { margin: 28px 0 10px; font-size: 18px; }
    .total { text-align: center; padding: 8px 0 16px; }
    .score { font-size: 56px; font-weight: 800; color: var(--accent); line-height: 1; }
    .score small { font-size: 20px; margin-left: 2px; }
    .grade { margin-top: 8px; font-size: 18px; font-weight: 700; }
    .bars > div { display: grid; grid-template-columns: 90px 1fr 32px; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
    .bars b { text-align: right; }
    .bar { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .detail { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .detail p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
    .tag { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }

    /* 점수 링 */
    .ring { position: relative; width: 180px; height: 180px; margin: 0 auto; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { stroke: var(--accent-soft); }
    .ring-fg { stroke: var(--accent); stroke-linecap: round; }
    .ring .score { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .grade { opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
    .grade.show { opacity: 1; transform: none; }
    .bar i { width: 0; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }

    /* 아바타 무대 */
    .stage {
      position: relative; overflow: hidden; margin-top: 24px; padding: 20px 16px;
      border-radius: 16px; background: linear-gradient(180deg, var(--accent-soft), #fff);
      text-align: center;
    }
    .stage.first { margin-top: 0; }
    .stage-title { margin: 0 0 4px; font-size: 15px; }
    .stage-title b { color: var(--accent); }
    .charm { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
    .avatar-wrap { width: 200px; margin: 0 auto; opacity: 0; transform: translateY(40px) scale(.9); }
    .avatar-wrap.show { animation: pop .8s cubic-bezier(.2, 1.4, .4, 1) forwards, float 3s ease-in-out .8s infinite; }
    .avatar-svg { display: block; width: 100%; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .talking .mouth { transform-box: fill-box; transform-origin: center; animation: talk .22s infinite alternate; }
    .bubble {
      position: relative; max-width: 460px; margin: 16px auto 0; padding: 14px 16px;
      background: #fff; border: 2px solid var(--accent); border-radius: 16px; text-align: left;
      opacity: 0; transition: opacity .4s;
    }
    .bubble.show { opacity: 1; }
    .bubble::before {
      content: ""; position: absolute; top: -10px; left: 50%; margin-left: -9px;
      border: 9px solid transparent; border-top: 0; border-bottom-color: var(--accent);
    }
    #speech { margin: 0; min-height: 52px; font-size: 16px; line-height: 1.6; }
    #nextLine {
      display: block; width: auto; max-width: none; margin: 8px 0 0 auto; padding: 6px 14px; font-size: 13px;
    }
    .heart { position: absolute; bottom: -24px; font-size: 22px; pointer-events: none; animation: rise 2.8s ease-in forwards; }

    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes talk { to { transform: scaleY(1.9); } }
    @keyframes rise { to { transform: translateY(-380px) rotate(25deg); opacity: 0; } }

    /* 솔로: 잘 맞는 사람 */
    .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .match { border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .match .label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .match .value { margin-top: 6px; font-size: 17px; font-weight: 800; }

    /* 연애 리포트 */
    .report { margin-top: 28px; }
    .chapter { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
    .chapter .no { font-size: 12px; font-weight: 700; color: var(--accent); }
    .chapter h4 { margin: 4px 0 8px; font-size: 17px; }
    .chapter p { margin: 0 0 6px; font-size: 14px; line-height: 1.7; }
    .chapter .tip { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    /* 공유 링크 */
    .share { display: flex; gap: 8px; margin-top: 20px; }
    .share input { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
    .share button { width: auto; max-width: none; margin: 0; padding: 10px 16px; font-size: 14px; white-space: nowrap; }

    footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
      .avatar-wrap, .grade { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="#" class="home-link" id="homeLink" hidden>← 처음으로</a>
      <h1>💕 연애 사주</h1>
    </header>

    <!-- 시작: 솔로 / 커플 선택 -->
    <section id="startView">
      <p class="sub">지금 어떤 상태인가요?</p>
      <div class="choices">
        <a class="choice" href="#solo">
          <div class="emoji">🙋</div>
          <h2>솔로예요</h2>
          <p>내 사주는 어떤 사람을 만나게 될까?<br />나와 잘 맞는 인연을 알려드려요.</p>
          <span class="go">내 인연 보러 가기</span>
        </a>
        <a class="choice" href="#couple">
          <div class="emoji">💑</div>
          <h2>커플이에요</h2>
          <p>우리 궁합은 몇 점일까?<br />사주·MBTI·혈액형·체격으로 알려드려요.</p>
          <span class="go">궁합 보러 가기</span>
        </a>
      </div>
    </section>

    <!-- 입력 -->
    <section id="formView" hidden>
      <p class="sub" id="formSub"></p>
      <form id="matchForm">
        <div class="people" id="people">
          <fieldset data-person="me">
            <legend>나</legend>
            <label for="me-gender">성별</label>
            <select id="me-gender" required>
              <option value="">선택하세요</option>
              <option value="female">여자</option>
              <option value="male">남자</option>
            </select>
            <label for="me-birth">생년월일</label>
            <input type="date" id="me-birth" required />
            <label for="me-age">나이</label>
            <input type="number" id="me-age" min="1" max="120" required />
            <p class="hint">생년월일을 입력하면 자동으로 계산됩니다</p>
            <div class="row">
              <div>
                <label for="me-height">키 (cm)</label>
                <input type="number" id="me-height" min="50" max="250" step="0.1" required />
              </div>
              <div>
                <label for="me-weight">몸무게 (kg)</label>
                <input type="number" id="me-weight" min="10" max="300" step="0.1" required />
              </div>
            </div>
            <label for="me-blood">혈액형</label>
            <select id="me-blood" required>
              <option value="">선택하세요</option>
              <option>A</option><option>B</option><option>O</option><option>AB</option>
            </select>
            <label for="me-mbti">MBTI</label>
            <select id="me-mbti" class="mbti-select" required>
              <option value="">선택하세요</option>
            </select>
            <div id="targetField">
              <label for="target-gender">만나고 싶은 상대</label>
              <select id="target-gender" required>
                <option value="">선택하세요</option>
                <option value="male">남자</option>
                <option value="female">여자</option>
              </select>
            </div>
          </fieldset>

          <fieldset data-person="partner" id="partnerFieldset">
            <legend>상대방</legend>
            <label for="partner-gender">성별</label>
            <select id="partner-gender" required>
              <option value="">선택하세요</option>
              <option value="female">여자</option>
              <option value="male">남자</option>
            </select>
            <label for="partner-birth">생년월일</label>
            <input type="date" id="partner-birth" required />
            <label for="partner-age">나이</label>
            <input type="number" id="partner-age" min="1" max="120" required />
            <p class="hint">생년월일을 입력하면 자동으로 계산됩니다</p>
            <div class="row">
              <div>
                <label for="partner-height">키 (cm)</label>
                <input type="number" id="partner-height" min="50" max="250" step="0.1" required />
              </div>
              <div>
                <label for="partner-weight">몸무게 (kg)</label>
                <input type="number" id="partner-weight" min="10" max="300" step="0.1" required />
              </div>
            </div>
            <label for="partner-blood">혈액형</label>
            <select id="partner-blood" required>
              <option value="">선택하세요</option>
              <option>A</option><option>B</option><option>O</option><option>AB</option>
            </select>
            <label for="partner-mbti">MBTI</label>
            <select id="partner-mbti" class="mbti-select" required>
              <option value="">선택하세요</option>
            </select>
          </fieldset>
        </div>

        <button type="submit" id="submitBtn">결과 보기</button>
      </form>

      <section id="result" hidden></section>
    </section>

    <footer>재미로 보는 연애 사주 · 태어난 시간 없이 생년월일로만 계산합니다</footer>
  </main>

  <script src="compat.js"></script>
  <script src="anime-avatar.js"></script>
  <script src="avatar.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
